document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

Fspan>\n  <\u002Fa>\n\n  <!-- ══ LIGHTBOX ══ -->\n  <sc-if value=\"{{ lightboxOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div onclick=\"{{ closeLightbox }}\" role=\"dialog\" aria-label=\"Imagem ampliada\" style=\"position: fixed; inset: 0; z-index: 100; background: rgba(5,25,33,.93); backdrop-filter: blur(6px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 24px; cursor: zoom-out; animation: vtFadeIn .25s ease;\">\n      <img ref=\"{{ lightboxImgRef }}\" alt=\"{{ lightboxAlt }}\" style=\"max-width: 94vw; max-height: 82vh; object-fit: contain; background: #fff; box-shadow: 0 30px 90px rgba(0,0,0,.6);\">\n      <div style=\"display: flex; align-items: center; gap: 16px;\">\n        <span style=\"font-size: 13px; font-weight: 600; letter-spacing: .08em; color: #fff;\">{{ lightboxAlt }}<\u002Fspan>\n        <button onclick=\"{{ closeLightbox }}\" aria-label=\"Fechar\" style=\"width: 42px; height: 42px; border-radius: 50%; border: none; background: #ECAA41; color: #0E3644; font-size: 19px; font-weight: 700; cursor: pointer; transition: transform .18s ease;\" style-hover=\"transform: scale(1.1);\">×<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;whatsapp&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;5511926143393&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Contato&quot;}}\">\nclass Component extends DCLogic {\n  state = { planta: 0, submitted: false, lightbox: null };\n\n  navRef = React.createRef();\n  galRef = React.createRef();\n  plantaImgRef = React.createRef();\n  lightboxImgRef = React.createRef();\n  nomeRef = React.createRef();\n  telRef = React.createRef();\n  emailRef = React.createRef();\n  msgRef = React.createRef();\n\n  plantas = [\n    { label: '66m²', area: '66m²', tipo: 'Apartamento tipo · 2 dorms · 1 suíte · 1 vaga',\n      img: 'https://faoliva.com.br/wp-content/uploads/2023/04/Planta-66m%C2%B2.png',\n      feats: ['2 dormitórios', '1 suíte', '1 vaga', 'Varanda grill'],\n      nota: 'Ilustração artística do apartamento de 2 dormitórios de 66m². Móveis, utensílios e itens de decoração são meramente ilustrativos e não fazem parte do Memorial Descritivo.' },\n    { label: '66,80m²', area: '66,80m²', tipo: 'Apartamento tipo · 2 dorms · 1 suíte · 1 vaga',\n      img: 'https://faoliva.com.br/wp-content/uploads/2023/04/Planta-6680m%C2%B2.png',\n      feats: ['2 dormitórios', '1 suíte', '1 vaga', 'Varanda grill'],\n      nota: 'Ilustração artística do apartamento de 2 dormitórios de 66,80m². Móveis, utensílios e itens de decoração são meramente ilustrativos e não fazem parte do Memorial Descritivo.' },\n    { label: 'Garden 82,9m²', area: '82,9m²', tipo: 'Garden · 2 dorms · 1 suíte · 1 vaga',\n      img: 'https://faoliva.com.br/wp-content/uploads/2023/04/Planta-829m%C2%B2.png',\n      feats: ['2 dormitórios', '1 suíte', '1 vaga', 'Unidade Garden'],\n      nota: 'Ilustração artística do apartamento tipo Garden de 2 dormitórios de 82,90m². Móveis, utensílios e itens de decoração são meramente ilustrativos e não fazem parte do Memorial Descritivo.' },\n    { label: 'Implantação', area: 'Implantação', tipo: 'Vista geral do empreendimento',\n      img: 'https://faoliva.com.br/wp-content/uploads/2023/12/Vila-Triunfo-1-1.webp',\n      feats: ['2 torres', '244 unidades', 'Térreo com 12 gardens + lazer'],\n      nota: 'Implantação geral do Residencial Vila Triunfo. Perspectiva artística, meramente ilustrativa.' }\n  ];\n\n  componentDidMount() {\n    // Sticky nav\n    this.onScroll = () => {\n      this.revealInView();\n      const el = this.navRef.current; if (!el) return;\n      const on = window.scrollY > 40;\n      el.style.background = on ? 'rgba(10,57,72,.92)' : 'transparent';\n      el.style.backdropFilter = on ? 'blur(10px)' : 'none';\n      el.style.boxShadow = on ? '0 6px 24px rgba l], [data-count]').forEach(el => {\n      if (el.dataset.vtDone || el.dataset.vtInit) return;\n      el.dataset.vtInit = '1';\n      if (el.hasAttribute('data-reveal')) {\n        el.style.opacity = '0';\n        el.style.transform = 'translateY(26px)';\n        el.style.transition = 'opacity .8s ease, transform .8s cubic-bezier(.2,.7,.2,1)';\n      }\n      this.io.observe(el);\n    });\n  }\n\n  revealEl(el) {\n    if (el.dataset.vtDone) return;\n    el.dataset.vtDone = '1';\n    if (el.hasAttribute('data-reveal')) { el.style.opacity = '1'; el.style.transform = 'none'; }\n    if (el.hasAttribute('data-count')) this.animateCount(el);\n  }\n\n  componentDidUpdate() {\n    this.initReveal();\n    this.syncImgs();\n    this.revealInView();\n  }\n\n  syncImgs() {\n    const p = this.plantas[this.state.planta];\n    const pi = this.plantaImgRef.current;\n    if (pi && pi.getAttribute('src') !== p.img) pi.src = p.img;\n    const lb = this.state.lightbox;\n    const li = this.lightboxImgRef.current;\n    if (li && lb && li.getAttribute('src') !== lb.src) li.src = lb.src;\n  }\n\n  revealInView() {\n    document.querySelectorAll('[data-reveal]').forEach(el => {\n      if (el.dataset.vtDone) return;\n      const r = el.getBoundingClientRect();\n      if (r.top < window.innerHeight && r.bottom > 0) this.revealEl(el);\n    });\n  }\n\n  animateCount(el) {\n    const target = parseFloat(el.getAttribute('data-count'));\n    const suffix = el.getAttribute('data-suffix') || '';\n    if (isNaN(target)) return;\n    const t0 = performance.now(), dur = 1400;\n    const step = now => {\n      const p = Math.min(1, (now - t0) / dur);\n      const eased = 1 - Math.pow(1 - p, 3);\n      const val = target % 1 === 0 ? Math.round(target * eased) : (target * eased).toFixed(1).replace('.', ',');\n      el.textContent = val + suffix;\n      if (p < 1) requestAnimationFrame(step);\n    };\n    requestAnimationFrame(step);\n  }\n\n  scrollGal(dir) {\n    const el = this.galRef.current; if (!el <script>
(function () {
  var CSS = '' +
    // Mesmo motivo do Altissimi: o overlay de erro do bundler e ferramenta

    '#__bundler_err{display:none !important}' +

    '.lt-voltar{background:#15241c;border-top:1px solid rgba(205,171,110,.28);padding:38px 24px calc(38px + env(safe-area-inset-bottom));position:relative;z-index:2}' +
    '.lt-voltar-in{max-width:1080px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}' +
    '.lt-voltar-marca{display:flex;align-items:center;gap:14px;min-width:0}' +
    '.lt-voltar-marca img{height:34px;width:auto;display:block;flex-shrink:0;margin:0}' +
    '.lt-voltar-marca span{font-family:system-ui,-apple-system,sans-serif;font-size:14px;line-height:1.45;color:rgba(247,242,232,.66);min-width:0}' +
    '.lt-voltar a{display:inline-flex;align-items:center;gap:10px;background:#b18a4a;color:#15241c;font-family:system-ui,-apple-system,sans-serif;font-size:15px;font-weight:600;line-height:1;text-decoration:none;padding:15px 26px;border-radius:40px;flex-shrink:0;transition:background .2s,transform .2s}' +
    '.lt-voltar a:hover{background:#cdab6e;transform:translateY(-1px)}' +
    '.lt-voltar a svg{flex-shrink:0}' +
    '.lt-voltar-rodape{border-top:1px solid rgba(255,255,255,.14);margin-top:28px;padding-top:26px;display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap}.lt-voltar-rodape a{display:inline-flex;align-items:center;gap:10px;background:#b18a4a;color:#15241c;font-family:system-ui,-apple-system,sans-serif;font-size:15px;font-weight:600;line-height:1;text-decoration:none;padding:15px 26px;border-radius:40px;transition:background .2s,transform .2s}.lt-voltar-rodape a:hover{background:#cdab6e;transform:translateY(-1px)}.lt-voltar-rodape svg{flex-shrink:0}';

  var SETA = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="m11 18-6-6 6-6"/></svg>';
  var CASA = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/></svg>';

  function montar() {
    if (!document.getElementById('lt-nav-css')) {
      var st = document.createElement('style');
      st.id = 'lt-nav-css';
      st.textContent = CSS;
      document.head.appendChild(st);
    }
    // O <footer> desta pagina so existe depois que o script dela monta o
    // conteudo, entao montar() pode rodar antes dele. Por isso o bloco cria o
    // botao onde der e, nas chamadas seguintes do MutationObserver, MUDA ele de
    // lugar quando o rodape aparece. Identificado por id e nao por classe: a
    // classe muda conforme o destino, e checar por classe recriava o elemento a
    // cada mutacao.
    var f = document.getElementById('lt-voltar-el');
    if (!f) {
      f = document.createElement('section');
      f.id = 'lt-voltar-el';
      f.innerHTML = '<a href="/lotus-lancamentos">' + SETA + 'Ver todos os lançamentos da Lotus</a>';
    }
    var rod = document.querySelector('footer');
    var destino = rod || document.body;
    f.className = rod ? 'lt-voltar-rodape' : 'lt-voltar';
    if (f.parentElement !== destino) destino.appendChild(f);
    // Mesma logica do botao do rodape: o <header> so existe depois que o
    // script da pagina monta o conteudo, entao o grupo e reposicionado quando
    // ele aparece, e identificado por id para nao ser recriado a cada mutacao.
          // "Inicio" e o PRIMEIRO item do menu do cabecalho e "Voltar" o ULTIMO,
      // com os itens da propria landing entre os dois. Antes era um grupo unico
      // que caia inteiro no fim da barra, com o rotulo "Lancamentos".
      //
      // Cada um tem id proprio, pela mesma razao do botao do rodape: o
      // MutationObserver chama montar() a cada mudanca do documento, e procurar
      // por classe recriaria os elementos toda vez.
      //
      // Espelha components/AtalhosLanding.tsx, que faz o mesmo nas landings em
      // React. Mudou la, muda aqui.
      var cab = document.querySelector('header');
      if (cab) {
        var links = cab.querySelectorAll('a');
        var nossos = function (a) {
          return a.parentElement &&
            (a.parentElement.id === 'lt-atalho-inicio-el' || a.parentElement.id === 'lt-atalho-voltar-el');
        };
        // A marca e o primeiro link que nao e nosso; o fim, o ultimo.
        var marca = null, ultimo = null, k;
        for (k = 0; k < links.length; k++) { if (!nossos(links[k])) { marca = links[k]; break; } }
        for (k = links.length - 1; k >= 0; k--) { if (!nossos(links[k])) { ultimo = links[k]; break; } }

        var ini = document.getElementById('lt-atalho-inicio-el');
        if (!ini) {
          ini = document.createElement('span');
          ini.id = 'lt-atalho-inicio-el';
          ini.className = 'lt-atalhos';
          ini.setAttribute('role', 'navigation');
          ini.setAttribute('aria-label', 'Ir para a home da Lotus');
          ini.innerHTML = '<a href="/">' + CASA + 'Início</a>';
        }
        var volt = document.getElementById('lt-atalho-voltar-el');
        if (!volt) {
          volt = document.createElement('span');
          volt.id = 'lt-atalho-voltar-el';
          volt.className = 'lt-atalhos';
          volt.setAttribute('role', 'navigation');
          volt.setAttribute('aria-label', 'Voltar para os lançamentos');
          // A classe .lt-atalhos traz margin-right, que serve ao 'Inicio'
          // (folga antes do menu) mas sobraria a direita do ultimo item.
          volt.style.marginRight = '0';
          volt.style.marginLeft = '12px';
          volt.innerHTML = '<a href="/lotus-lancamentos">' + SETA + 'Voltar</a>';
        }

        if (window.innerWidth < 1100) {
          // Abaixo de 1100px o container dos CTAs e escondido pela media query
          // da propria landing. Os dois voltam para o <header>, em linha
          // propria, na ordem Inicio -> Voltar.
          if (ini.parentElement !== cab) cab.appendChild(ini);
          if (volt.parentElement !== cab) cab.appendChild(volt);
        } else {
          var menu = cab.querySelector('nav');
          var alvoIni = null;
          if (menu && marca && !menu.contains(marca)) {
            // Menu separado da marca: "Inicio" e o primeiro item dele.
            if (ini.parentElement !== menu) menu.insertBefore(ini, menu.firstChild);
            alvoIni = menu;
          } else if (marca && marca.parentElement) {
            // Marca dentro do menu: "Inicio" entra logo depois dela, para nao
            // ficar na frente do logo.
            if (ini.parentElement !== marca.parentElement) {
              marca.parentElement.insertBefore(ini, marca.nextSibling);
            }
            alvoIni = marca.parentElement;
          }
          if (!alvoIni && ini.parentElement !== cab) cab.insertBefore(ini, cab.firstChild);

          var fim = (ultimo ? ultimo.parentElement : null) || cab;
          if (volt.parentElement !== fim) fim.appendChild(volt);
        }
      }

}

  function ligar() {
    montar();

    new MutationObserver(function () {
      // montar() e idempotente: acha por id e so mexe se precisar. Roda sempre
      // que o documento muda, para reposicionar o botao quando o <footer> surgir.
      montar();
    }).observe(document.documentElement, { childList: true, subtree: true });
  }

  if (document.readyState === 'complete') ligar();
  else window.addEventListener('load', ligar);
})();
</script>

<!-- lightbox-plantas: espelho de components/LightboxPlantas.tsx.

     scroll. Ao converter esta landing para componente React, apagar este
     bloco e montar <LightboxPlantas />. -->

<script>
(function () {
  var RE = /planta|tipologia|implanta/i;
  var SEC = '[id*="planta" i], [id*="tipologia" i]';
  function ehPlanta(img) {
    if (RE.test(img.alt || '')) return true;
    return !!(img.closest && img.closest(SEC));
  }

  // CSS por JavaScript e nao como <style> no arquivo: nas paginas que
  // reconstroem o documento no load, um <style> estatico e apagado junto e o
  // modal abria sem estilo nenhum.
  var CSS_LB = '#lt-planta-lb{position:fixed;inset:0;z-index:300;display:none;align-items:center;justify-content:center;padding:clamp(12px,4vw,40px);background:rgba(10,14,12,.94);backdrop-filter:blur(3px);cursor:zoom-out}#lt-planta-lb[open]{display:flex;animation:ltPlantaEntra .22s ease-out}@keyframes ltPlantaEntra{from{opacity:0}to{opacity:1}}@media (prefers-reduced-motion:reduce){#lt-planta-lb[open]{animation:none}}#lt-planta-lb figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:14px;max-height:100%}#lt-planta-lb img{display:block;max-width:min(1600px,96vw);max-height:84vh;width:auto;height:auto;object-fit:contain;border-radius:6px;background:#fff;cursor:default;box-shadow:0 30px 90px rgba(0,0,0,.55)}#lt-planta-lb figcaption{color:rgba(255,255,255,.82);font-family:system-ui,-apple-system,sans-serif;font-size:14px;text-align:center;max-width:90vw}#lt-planta-lb button{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:14px;width:46px;height:46px;border-radius:50%;border:1px solid rgba(255,255,255,.32);background:rgba(0,0,0,.42);color:#fff;font-size:26px;line-height:1;cursor:pointer}';
  function garantirCss() {
    if (document.getElementById('lt-planta-css')) return;
    var st = document.createElement('style');
    st.id = 'lt-planta-css';
    st.textContent = CSS_LB;
    document.head.appendChild(st);
  }
  var lb, alvo, legenda, scrollAnterior;
  function montarModal() {
    garantirCss();
    // Nas paginas que reconstroem o documento o modal antigo fica orfao:
    // checar containment, e nao so a existencia da variavel.
    var atual = document.getElementById('lt-planta-lb');
    if (atual && document.body.contains(atual)) { lb = atual; alvo = lb.querySelector('img'); legenda = lb.querySelector('figcaption'); return; }
    lb = document.createElement('div');
    lb.id = 'lt-planta-lb';
    lb.setAttribute('role', 'dialog');
    lb.setAttribute('aria-modal', 'true');
    lb.innerHTML = '<button type="button" aria-label="Fechar">&times;</button>' +
                   '<figure><img alt=""><figcaption></figcaption></figure>';
    document.body.appendChild(lb);
    alvo = lb.querySelector('img');
    legenda = lb.querySelector('figcaption');
    // Fundo e botao fecham; a imagem nao, para dar para aproximar sem fechar.
    lb.addEventListener('click', fechar);
    alvo.addEventListener('click', function (e) { e.stopPropagation(); });
  }

  function abrir(img) {
    montarModal();
    alvo.src = img.currentSrc || img.src;
    alvo.alt = img.alt || 'Planta do empreendimento';
    legenda.textContent = alvo.alt;
    lb.setAttribute('aria-label', alvo.alt);
    lb.setAttribute('open', '');
    scrollAnterior = document.body.style.overflow;
    document.body.style.overflow = 'hidden';
  }

  function fechar() {
    if (!lb || !lb.hasAttribute('open')) return;
    lb.removeAttribute('open');
    document.body.style.overflow = scrollAnterior || '';
    alvo.removeAttribute('src');
  }

  // Fase de captura: impede que o lightbox proprio da pagina abra junto.
  document.addEventListener('click', function (e) {
    var img = e.target && e.target.closest && e.target.closest('img');
    if (!img || !ehPlanta(img)) return;
    e.preventDefault();
    e.stopPropagation();
    abrir(img);
  }, true);

  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') fechar(); });

  function marcar() {
    var imgs = document.querySelectorAll('img');
    for (var i = 0; i < imgs.length; i++) if (ehPlanta(imgs[i])) imgs[i].style.cursor = 'zoom-in';
  }
  function ligar() {
    montarModal();
    marcar();
    new MutationObserver(function () { montarModal(); marcar(); })
      .observe(document.documentElement, { childList: true, subtree: true });
  }
  if (document.readyState === 'complete') ligar();
  else window.addEventListener('load', ligar);
})();
</script>

1/-1}}@media(max-width:560px){[data-rodape-lotus-grid]{grid-template-columns:1fr}[data-rodape-lotus-base]{justify-content:flex-start}}";
  var HTML = "<div data-rodape-lotus=\"\">\n  <div data-rodape-lotus-grid=\"\">\n    <div class=\"lt-marca\">\n      <img src=\"/logo-lotus-dourado.png\" alt=\"Lotus Brokers\">\n      <p class=\"lt-tag\">Grandes escolhas têm endereço.</p>\n      <p class=\"lt-desc\">Consultoria imobiliária para compra, venda, locação e investimento em imóveis de médio e alto padrão em Jundiaí, Itupeva e região.</p>\n      <a class=\"lt-cta\" href=\"/lotus-lancamentos\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M19 12H5\"/><path d=\"m11 18-6-6 6-6\"/></svg>Ver todos os lançamentos</a>\n    </div>\n    <div>\n      <div class=\"lt-col-t\">A Lotus</div>\n      <div class=\"lt-col\"><a href=\"/lotus-sobre\">Sobre nós</a><a href=\"/lotus-corretores\">Corretores</a><a href=\"/lotus-recrutamento\">Seja um corretor</a></div>\n    </div>\n    <div>\n      <div class=\"lt-col-t\">Serviços</div>\n      <div class=\"lt-col\"><a href=\"/lotus-lancamentos\">Lançamentos</a><a href=\"/lotus-busca\">Comprar &amp; alugar</a><a href=\"/lotus-anunciar\">Anunciar imóvel</a><a href=\"/lotus-bairro\">Bairros</a><a href=\"/lotus-blog\">Blog</a></div>\n    </div>\n    <div>\n      <div class=\"lt-col-t\">Políticas</div>\n      <div class=\"lt-col\"><a href=\"/lotus-privacidade\">Privacidade (LGPD)</a><a href=\"/lotus-termos\">Termos de uso</a><a href=\"/lotus-cookies\">Cookies</a></div>\n    </div>\n  </div>\n  <div data-rodape-lotus-base=\"\">\n    <div>© 2026 Lotus Brokers · CRECI 054615-J · CNPJ 67.767.385/0001-98 · Jundiaí · Itupeva · SP</div>\n    <div class=\"lt-redes\"><a href=\"https://www.facebook.com/profile.php?id=61587132887416&locale=pt_BR\" target=\"_blank\" rel=\"noopener\" aria-label=\"Facebook\"><svg width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"currentColor\"><path d=\"M14 9h3V6h-3c-1.7 0-3 1.3-3 3v2H9v3h2v7h3v-7h2.5l.5-3H14V9.5c   function alinhar(bloco, rod) {
    // Alinha o bloco institucional com o conteudo do rodape da propria pagina.
    //
    // O bloco e filho direto do <footer>, mas o padding horizontal quase sempre
    // mora num container INTERNO. Sem isto ele encosta na borda da tela enquanto
    // o resto do rodape respeita o recuo — no Santorini a linha de CRECI e CNPJ
    // chegava a aparecer cortada.
    //
    // Medido e nao fixo porque cada landing usa o seu (20, 24, 28, 48px, e
    // clamp() em varias). A referencia e o primeiro texto do rodape que nao
    // pertence ao bloco, ignorando o que estiver a mais de 120px: um titulo
    // centralizado daria um numero sem sentido.
    //
    // Espelha components/RodapeLotus.tsx, que faz o mesmo nas landings em React.
    // Mudou la, muda aqui.
    if (!bloco || !rod) return;
    var borda = bloco.getBoundingClientRect().left;
    var todos = rod.querySelectorAll('*');
    var recuo = 0;
    for (var q = 0; q < todos.length; q++) {
      var alvo = todos[q];
      if (bloco.contains(alvo) || alvo.children.length > 0) continue;
      if ((alvo.textContent || '').trim().length < 3) continue;
      var d = Math.round(alvo.getBoundingClientRect().left - borda);
      if (d > 0 && d < 120) { recuo = d; break; }
    }
    bloco.style.paddingLeft = recuo + 'px';
    bloco.style.paddingRight = recuo + 'px';
    // Faixa livre para os CTAs flutuantes: sao fixed no canto inferior direito e
    // cobriam a linha de CRECI e CNPJ, que e informacao obrigatoria.
    bloco.style.paddingBottom = (window.innerWidth <= 760 ? 92 : 64) + 'px';
  }
  function garantir() {
    if (!document.getElementById('lt-rodape-css')) {
      var st = document.createElement('style');
      st.id = 'lt-rodape-css';
      st.textContent = CSS;
      document.head.appendChild(st);
    }
    var rod = document.querySelector('footer');
    if (!rod) return;
    var atual = rod.querySelector('[data-rodape-lotus]');
    if (atual) { alinhar(atual, rod); return; }
    var el = document.createElement('div');
    el.innerHTML = HTML;
    rod.appendChild(el.firstElementChild);
    alinhar(rod.querySelector('[data-rodape-lotus]'), rod);
  }
  function ligar() {
    garantir();
    // O recuo muda com a largura: varias landings usam clamp() no padding.
    window.addEventListener('resize', garantir);
    // Paginas empacotadas reconstroem o documento: recolocar quando isso ocorre.
    new MutationObserver(garantir).observe(document.documentElement, { childList: true, subtree: true });
  }
  if (document.readyState === 'complete') ligar();
  else window.addEventListener('load', ligar);
})();
</script>
